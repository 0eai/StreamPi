# Single source of truth for app versioning, read at Gradle configuration time.
#
# versionCode must strictly increase for every APK you distribute: Android refuses to
# install a package whose versionCode is lower than the installed one, and sideload flows
# commonly reject an equal one as "already installed". Bump it with:
#
#     ./gradlew bumpVersionCode
#
# Note the ordering: Gradle reads this file while configuring, so a bump and an assemble
# in the same invocation would still build the old number. Run them as separate
# invocations, or use ./deploy-apk.sh which does it in the right order.
versionCode=15
versionName=1.1
